<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 小游戏 - 源科技</title>
  <meta name="description" content="在浏览器里直接玩的 2048 小游戏，支持键盘、触屏滑动与屏幕按钮。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M16 40c8-2 14-8 16-16 8 2 14 8 16 16H16z' fill='white'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #0f172a; --muted: #5b6478; --brand: #4f46e5;
      --grad: linear-gradient(120deg, #4f46e5, #7c3aed 60%, #9333ea);
      --line: #e6eaf3; --bg-soft: #f4f6fb;
      --font: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(circle at 15% 10%, rgba(199,210,254,.5), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(243,232,255,.6), transparent 40%),
        var(--bg-soft);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 90px;
      color: var(--ink);
    }
    .top { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .back { color: var(--brand); font-weight: 600; font-size: .92rem; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .home-link { font-size: .9rem; color: var(--muted); }
    .home-link a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .home-link a:hover { text-decoration: underline; }

    .card {
      width: 100%; max-width: 420px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 44px rgba(79,70,229,.12);
      padding: 22px;
    }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .head h1 { font-size: 1.5rem; letter-spacing: -.3px; }
    .head h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .scores { display: flex; gap: 8px; }
    .score-box { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; text-align: center; min-width: 74px; }
    .score-box small { display: block; color: var(--muted); font-size: .7rem; letter-spacing: .06em; }
    .score-box strong { font-size: 1.1rem; line-height: 1.2; }
    .score-box.best strong { color: var(--brand); }
    .ctrl { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-bottom: 14px; }
    .btn {
      border: none; border-radius: 999px; cursor: pointer;
      padding: 8px 16px; font-size: .88rem; font-weight: 600; font-family: inherit;
      color: #fff; background: var(--grad); box-shadow: 0 6px 16px rgba(99,91,255,.3);
      transition: transform .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.ghost { background: var(--bg-soft); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }

    .board-wrap { position: relative; }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: #e8ebf5;
      border-radius: 14px;
      padding: 10px;
      aspect-ratio: 1 / 1;
      user-select: none;
      touch-action: none;
    }
    .cell {
      display: grid; place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,.55);
      font-weight: 800;
      font-size: 1.9rem;
      color: #3c4563;
      transition: background .12s ease;
      overflow: hidden;
    }
    .cell[data-v="0"] { color: transparent; }
    .cell[data-v="2"]  { background: #eef0ff; }
    .cell[data-v="4"]  { background: #e0e5ff; }
    .cell[data-v="8"]  { background: #c7d2fe; color: #312e81; }
    .cell[data-v="16"] { background: #a5b4fc; color: #1e1b4b; }
    .cell[data-v="32"] { background: #818cf8; color: #fff; }
    .cell[data-v="64"] { background: #6366f1; color: #fff; }
    .cell[data-v="128"] { background: #8b5cf6; color: #fff; font-size: 1.55rem; }
    .cell[data-v="256"] { background: #7c3aed; color: #fff; font-size: 1.55rem; }
    .cell[data-v="512"] { background: #6d28d9; color: #fff; font-size: 1.4rem; }
    .cell[data-v="1024"] { background: #5b21b6; color: #fff; font-size: 1.15rem; }
    .cell[data-v="2048"] { background: linear-gradient(135deg,#f97316,#ec4899); color: #fff; font-size: 1.15rem; }
    .cell[data-v^="4"] { font-size: 1.15rem; }
    .cell[data-v="4096"], .cell[data-v="8192"], .cell[data-v="16384"] { background: #f59e0b; color: #fff; font-size: 1.05rem; }
    .cell.pop { animation: pop .18s ease; }
    @keyframes pop { 0% { transform: scale(.75); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

    .overlay {
      position: absolute; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: rgba(15,23,42,.55);
      border-radius: 14px;
      color: #fff; text-align: center;
      padding: 20px;
    }
    .overlay.show { display: flex; }
    .overlay h2 { font-size: 1.7rem; }
    .overlay p { opacity: .9; font-size: .92rem; }
    .overlay .btn { font-size: 1rem; padding: 10px 22px; }

    .hint { margin-top: 14px; text-align: center; color: var(--muted); font-size: .84rem; }
    .pad {
      margin-top: 16px;
      display: none;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 54px);
      gap: 8px;
      justify-content: center;
    }
    .pad button {
      border: none; border-radius: 14px; background: #fff;
      border: 1px solid var(--line); box-shadow: 0 6px 14px rgba(79,70,229,.08);
      font-size: 1.5rem; color: var(--brand); cursor: pointer; font-family: inherit;
    }
    .pad button:active { transform: scale(.94); }
    .pad .up { grid-column: 2; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
    @media (hover: none) and (pointer: coarse) { .pad { display: grid; } }
    @media (max-width: 480px) { .pad { display: grid; } }
  </style>
</head>
<body>
  <div class="top">
    <a class="back" href="index.html">← 返回首页</a>
    <div class="home-link">源科技 · <a href="index.html">官网</a></div>
  </div>

  <div class="card">
    <div class="head">
      <h1><span>2048</span> 小游戏</h1>
      <div class="scores">
        <div class="score-box"><small>分数</small><strong id="score">0</strong></div>
        <div class="score-box best"><small>最高分</small><strong id="best">0</strong></div>
      </div>
    </div>
    <div class="ctrl">
      <span style="font-size:.82rem;color:var(--muted);margin-right:auto;">用 ↑↓←→ 或滑动屏幕移动方块</span>
      <button class="btn ghost" id="btnRestart">重新开始</button>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" aria-label="2048 游戏棋盘"></div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">🎉 你赢了！</h2>
        <p id="ovText">合成了 2048，太厉害了！</p>
        <button class="btn" id="ovBtn">继续游戏</button>
      </div>
    </div>
    <p class="hint">滑动相邻的相同数字进行合并，直到合成 <b>2048</b></p>

    <div class="pad" id="pad">
      <button class="up" data-dir="up" aria-label="上">↑</button>
      <button class="left" data-dir="left" aria-label="左">←</button>
      <button class="down" data-dir="down" aria-label="下">↓</button>
      <button class="right" data-dir="right" aria-label="右">→</button>
    </div>
  </div>

  <script>
    (function () {
      "use strict";
      var SIZE = 4;
      var boardEl = document.getElementById("board");
      var scoreEl = document.getElementById("score");
      var bestEl = document.getElementById("best");
      var overlay = document.getElementById("overlay");
      var ovTitle = document.getElementById("ovTitle");
      var ovText = document.getElementById("ovText");
      var ovBtn = document.getElementById("ovBtn");
      var BEST_KEY = "g2048_best_yunfan";

      var grid = [], score = 0, best = 0, won = false, over = false;
      try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) {}
      bestEl.textContent = best;

      function emptyCells() {
        var arr = [];
        for (var i = 0; i < SIZE * SIZE; i++) if (grid[i] === 0) arr.push(i);
        return arr;
      }
      function addTile() {
        var cells = emptyCells();
        if (!cells.length) return;
        var idx = cells[Math.floor(Math.random() * cells.length)];
        grid[idx] = Math.random() < 0.9 ? 2 : 4;
      }
      function slideRow(row) {
        var arr = row.filter(function (v) { return v !== 0; });
        var out = [], gained = 0;
        for (var i = 0; i < arr.length; i++) {
          if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
            out.push(arr[i] * 2); gained += arr[i] * 2; i++;
          } else {
            out.push(arr[i]);
          }
        }
        while (out.length < SIZE) out.push(0);
        return { row: out, gained: gained };
      }
      function move(dir) {
        var changed = false, gained = 0, mergedAt = [];
        function getLine(r, c) {
          var line = [];
          for (var k = 0; k < SIZE; k++) {
            var i = dir === 0 ? r * SIZE + (dir === 0 ? k : 0) : 0;
            var row, col;
            if (dir === 0) { row = r; col = k; }
            else if (dir === 1) { row = r; col = SIZE - 1 - k; }
            else if (dir === 2) { row = k; col = c; }
            else { row = SIZE - 1 - k; col = c; }
            line.push(grid[row * SIZE + col]);
          }
          return line;
        }
        function setLine(r, c, line, rowIdx) {
          for (var k = 0; k < SIZE; k++) {
            var row, col;
            if (dir === 0) { row = r; col = k; }
            else if (dir === 1) { row = r; col = SIZE - 1 - k; }
            else if (dir === 2) { row = k; col = c; }
            else { row = SIZE - 1 - k; col = c; }
            var idx = row * SIZE + col;
            if (grid[idx] !== line[k]) changed = true;
            grid[idx] = line[k];
            if (dir === 2) mergedAt.push(idx);
          }
        }
        if (dir === 0 || dir === 1) {
          for (var r = 0; r < SIZE; r++) {
            var res = slideRow(getLine(r, 0));
            gained += res.gained;
            setLine(r, 0, res.row, r);
          }
        } else {
          for (var c = 0; c < SIZE; c++) {
            var res2 = slideRow(getLine(0, c));
            gained += res2.gained;
            setLine(0, c, res2.row, c);
          }
        }
        return { changed: changed, gained: gained };
      }

      function canMove() {
        for (var i = 0; i < SIZE * SIZE; i++) {
          if (grid[i] === 0) return true;
          var r = Math.floor(i / SIZE), c = i % SIZE;
          if (c + 1 < SIZE && grid[i] === grid[r * SIZE + c + 1]) return true;
          if (r + 1 < SIZE && grid[i] === grid[(r + 1) * SIZE + c]) return true;
        }
        return false;
      }

      function render(popIdx) {
        boardEl.innerHTML = "";
        for (var i = 0; i < SIZE * SIZE; i++) {
          var cell = document.createElement("div");
          cell.className = "cell";
          cell.setAttribute("data-v", grid[i]);
          if (grid[i] !== 0) cell.textContent = grid[i];
          if (popIdx && popIdx.indexOf(i) >= 0) cell.classList.add("pop");
          boardEl.appendChild(cell);
        }
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem(BEST_KEY, best); } catch (e) {} }
      }

      function endOverlay(title, text, btnText, isWin) {
        won = isWin;
        ovTitle.textContent = title;
        ovText.textContent = text;
        ovBtn.textContent = btnText;
        overlay.classList.add("show");
      }

            function afterMove(before) {
        var pop = [];
        for (var i = 0; i < grid.length; i++) {
          if (grid[i] !== before[i] && grid[i] !== 0 && before[i] !== 0) pop.push(i);
        }
        render(pop);
        if (!won) {
          for (var j = 0; j < SIZE * SIZE; j++) {
            if (grid[j] === 2048) {
              endOverlay("🎉 你赢了！", "成功合成 2048，太厉害了！", "继续挑战", true);
              return;
            }
          }
        }
        if (!canMove()) endOverlay("😵 游戏结束", "没有可以合并的方块了", "再来一局", false);
      }

      function doMove(dir) {
        if (over) return;
        var before = grid.slice();
        var moved = move(dir);
        if (!moved.changed) return;
        score += moved.gained;
        addTile();
        afterMove(before);
      }

function restart() {
        grid = [];
        for (var i = 0; i < SIZE * SIZE; i++) grid.push(0);
        score = 0; won = false; over = false;
        overlay.classList.remove("show");
        addTile(); addTile();
        render([]);
      }

      ovBtn.addEventListener("click", function () {
        overlay.classList.remove("show");
        over = won; /* 赢了点继续：允许继续挑战；结束后点再来一局则重开 */
        if (!won) restart();
        won = false; over = false;
      });
      document.getElementById("btnRestart").addEventListener("click", restart);

      document.addEventListener("keydown", function (e) {
        var map = {
          ArrowUp: 2, ArrowDown: 3, ArrowLeft: 0, ArrowRight: 1,
          w: 2, s: 3, a: 0, d: 1, W: 2, S: 3, A: 0, D: 1
        };
        if (map[e.key] !== undefined) {
          e.preventDefault();
          doMove(map[e.key]);
        }
      });

      var tx = null, ty = null;
      boardEl.addEventListener("touchstart", function (e) {
        tx = e.touches[0].clientX; ty = e.touches[0].clientY;
      }, { passive: true });
      boardEl.addEventListener("touchend", function (e) {
        if (tx === null) return;
        var dx = e.changedTouches[0].clientX - tx;
        var dy = e.changedTouches[0].clientY - ty;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) doMove(dx > 0 ? 1 : 0);
        else doMove(dy > 0 ? 3 : 2);
        tx = null; ty = null;
      }, { passive: true });

      var pad = document.getElementById("pad");
      if (pad) {
        pad.addEventListener("click", function (e) {
          var b = e.target.closest ? e.target.closest("button[data-dir]") : null;
          if (!b) return;
          var dirMap = { up: 2, down: 3, left: 0, right: 1 };
          var d = dirMap[b.getAttribute("data-dir")];
          if (d !== undefined) doMove(d);
        });
      }

      restart();
    })();
  </script>
</body>
</html>
